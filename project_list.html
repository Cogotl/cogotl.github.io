<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cogotl(The one with the website)</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts/projectlist.js" defer></script>
  <style>
    html, body {
        height: 100%;
        margin: 0;
        padding:0;
    }
    #app {
        width:100%;
        height: 100%;
        top:0;
        left:0;
        padding:0;
        margin:0;
        display: flex;
        flex-direction: column;
    }

    #category-list {
        height: 75px;
        border-bottom:5px solid #a493b9;

    }
    #project-list {
        display:flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap:10px;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin:0;
    }
    .project-list-entry {
        display:flex;
        align-items: flex-start;
        justify-content: flex-start;
        flex-direction: column;
        gap:2px;
        width:90%;
        padding:5px;
        margin:0;
        border: 2px solid #bebebe;
        border-radius:10px;
    }
    .entry-text {
        padding:0;
        margin:0;
    }
    .category-list-entry{
        transform: translateY(0);
        transition: transform 0.3s ease
    }
    .selected{
        transform:translateY(-10px);
        
    }
  </style>
</head>
<body>
    <div id="app">
        <div id="category-list"class="topbar horizontalList">
            <button class="stylise">Back</button>
        </div>
        <div id="text"class="topbar"style="font-weight:bold;font-size:25px;border-bottom:5px solid #a493b9"></div>
        <div id="project-list"style="padding-top:15px;"></div>
    </div> 
</body>
</html>
